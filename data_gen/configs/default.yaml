watermark_profile: ../../configs/profiles/default.yaml

seed: 42

download:
  csv_path: "./data/sql.csv"
  failed_urls_path: "./data/failed_urls.txt"
  num_images: 15000
  workers: 10

dataset:
  output_dir: "./dataset"
  train_split: 0.9
  num_samples: 15000
  resume: true

paths:
  clean_images_dir: "./clean_images"
  watermark_path: "./watermark.png"

placement:
  width_fraction: [0.76, 0.82]

alpha:
  base_range: [0.085, 0.115]
  perturbation: 0.02
  spatial_noise_std: 0.01

blending:
  linear_prob: 0.0

shadow:
  enabled: true
  offset_range: [1, 3]
  blur_range: [2.0, 4.0]
  opacity_range: [0.02, 0.06]

edge:
  gaussian_sigma_range: [0.0, 0.4]
  morph_kernel: [0, 1]

degradation:
  jpeg_quality: [30, 95]
  webp_quality: [20, 95]
  downscale_range: [0.75, 1.0]
