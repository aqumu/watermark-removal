# Cian student C v4: C v3 plus a thin full-resolution refine head (16 channels): the half-resolution
# students left faint ghosts of the 2-3 px text strokes. Fine-tuned from student c v3
# (--load-weights training/runs/teachers/student_c_v3_best.pth), distilled from teacher ft7.
mark: cian

data:
  backgrounds:
    # in-domain photos: Cian photos away from their own mark (bottom-right corner)
    - {csv: data_gen/backgrounds/cian_index.csv, kind: mark}
    # clean real-estate photos without any mark
    - {dir: data_gen/clean_images, kind: clean}
  holdout: 0.05            # fraction of listings / images kept for validation and previews
  bg_scale:                # random downscale of a background, like a resized original
    mark: [0.6, 1.0]
    clean: [0.75, 1.0]
  mark_deviation:          # the stamped mark differs slightly from the nominal template
    opacity_scale: [0.75, 1.30]
    overlay_shift: [-12.0, 12.0]
    # per-photo edge variation around the template (m + k * highpass(m)); real marks match the
    # template on average, single photos are resized from different originals
    sharpness: [-0.5, 0.4]
    shadow_gain: [0.6, 1.4]        # logo shadow strength per photo (x the measured profile)
    shadow_rgb_jitter: [0.85, 1.15]
  quality_jitter_prob: 0.05
  wrong_id_prob: 0.05       # hint rendered with another ID (re-used photos)
  text_offset: {x: [-5.0, 5.0], y: [-3.5, 3.5]}   # stamped text line vs its nominal placement
  mark_scale: [0.97, 1.03]  # stamped size vs the template
  no_text_prob: 0.015       # marks with the logo only
  double_mark_prob: 0.08    # a second mark (another listing) under the listing's own, unhinted
  quality_jitter_range: [70, 95]
  hint_scale: 8.0
  val_samples: 512
  num_workers: 10
  preview_csv: data_gen/backgrounds/cian_index.csv
  preview_count: 6

model:
  in_channels: 7
  widths: [32, 48, 64, 96]
  unshuffle: 2
  refine: 16

training:
  epochs: 10
  steps_per_epoch: 1000
  batch_size: 16
  lr: 3.0e-4
  min_lr: 2.0e-5
  warmup_steps: 300
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: true
  ema_decay: 0.999
  val_every: 1

loss:
  region_weight: 10.0
  pixel: 1.0
  grad: 1.0
  ghost: 0.05             # |leftover-mark amplitude| (see losses.py)

checkpointing:
  dir: ./runs/_ckpt_unused     # replaced by the run folder at start
  keep_last: 3

logging:
  dir: ./runs/overlay_cian_student_c_v4
  log_every: 50

seed: 42
device: cuda

distill:
  checkpoint: training/runs/teachers/teacher_ft7_best.pth
  weight: 1.0
  model:
    in_channels: 7
    widths: [48, 96, 128, 192]
