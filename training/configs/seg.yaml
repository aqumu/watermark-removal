watermark_profile: ../../configs/profiles/default.yaml

dataset:
  root: "../data_gen/dataset" # same dataset used for removal training
  image_size: 256 # 128 produced pixel-art masks; 256 gives full detail
  train_split: 0.9
  num_workers: 2
  max_samples: 10000

model:
  encoder: efficientnet-b0 # pretrained ImageNet encoder — distinguishes logos from textures

training:
  epochs: 80
  batch_size: 4
  lr: 1.0e-4         # decoder / head LR (randomly initialised)
  encoder_lr: 1.0e-5 # encoder LR — 10× lower to protect pretrained ImageNet weights
  lr_scheduler: step
  weight_decay: 1.0e-4
  pos_weight: 3.0    # EfficientNet backbone is strong; no need for extreme positive weighting
  focal_gamma: 2.0   # focal loss gamma — higher = more focus on hard pixels (0 = disabled)
  loss_weights:
    bce: 0.25        # reduced — less reliance on BCE now that L1/ms drive interior fill
    focal: 0.25      # reduced — edges are already handled
    l1: 1.0          # increased — directly pulls sigmoid outputs toward target values for solid fills
    ms: 1.0          # increased — penalises hollow/outline-only predictions at coarse scales
    dice: 0.5        # still useful for overlap
  grad_accum_steps: 1
  grad_clip: 2.0     # pretrained encoder produces smaller, more stable gradients
  val_every: 1
  amp: true # bfloat16 mixed precision (activates only on CUDA)

torch_threads: 0

checkpointing:
  dir: "./artifacts/checkpoints/segmentation"
  save_every: 5
  keep_last: 3

logging:
  dir: "./runs/segmentation"
  log_every: 20
  preview_every: 40 # update visualisation every N global steps (0 = epoch-end only)

seed: 42
device: cuda
